name: tools-teleprompt

services:
  redis:
    image: redis:7.4-alpine
    networks:
      - teleprompt-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../api
      target: dev
    environment:
      REDIS_URL: redis://redis:6379/0
      API_MAX_SCRIPT_BYTES: ${API_MAX_SCRIPT_BYTES:-262144}
      API_SESSION_TTL_SECONDS: ${API_SESSION_TTL_SECONDS:-300}
      API_RATE_LIMIT_CREATE: ${API_RATE_LIMIT_CREATE:-10}
      API_RATE_LIMIT_CLAIM: ${API_RATE_LIMIT_CLAIM:-20}
    volumes:
      - ../api:/app
      - api_pip_cache:/root/.cache/pip
    command: >
      sh -c "pip install -q -e '.[dev]' && uvicorn main:app --host 0.0.0.0 --port 8000 --reload --app-dir src"
    networks:
      - teleprompt-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - teleprompt-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "${CADDY_HOST_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - teleprompt-net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  teleprompt-net:
    driver: bridge

volumes:
  frontend_node_modules:
  api_pip_cache:
