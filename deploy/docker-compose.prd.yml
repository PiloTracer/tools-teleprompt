services:
  redis:
    image: redis:7.4-alpine
    container_name: ${STACK_NAME:-tools-teleprompt}-redis-${STACK_ENV:-prd}
    networks:
      - teleprompt-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile.prd
    container_name: ${STACK_NAME:-tools-teleprompt}-api-${STACK_ENV:-prd}
    env_file:
      - ${TP_ENV_FILE:-../.env.prd}
    environment:
      REDIS_URL: redis://redis:6379/0
      API_DEV_PORT: ${API_DEV_PORT:-8000}
      API_MAX_SCRIPT_BYTES: ${API_MAX_SCRIPT_BYTES:-262144}
      API_SESSION_TTL_SECONDS: ${API_SESSION_TTL_SECONDS:-300}
      API_RATE_LIMIT_CREATE: ${API_RATE_LIMIT_CREATE:-10}
      API_RATE_LIMIT_CLAIM: ${API_RATE_LIMIT_CLAIM:-20}
      API_OTP_HMAC_SECRET: ${API_OTP_HMAC_SECRET}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    networks:
      - teleprompt-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, json, urllib.request; r = urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['API_DEV_PORT']}/health\"); exit(0 if json.loads(r.read()).get('status') == 'ok' and r.status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prd
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: ${STACK_NAME:-tools-teleprompt}-frontend-${STACK_ENV:-prd}
    networks:
      - teleprompt-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    container_name: ${STACK_NAME:-tools-teleprompt}-caddy-${STACK_ENV:-prd}
    ports:
      - "${CADDY_HOST_PORT:-9080}:80"
    volumes:
      - ./Caddyfile.prd:/etc/caddy/Caddyfile:ro
    networks:
      - teleprompt-net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

networks:
  teleprompt-net:
    name: ${STACK_NAME:-tools-teleprompt}-net-${STACK_ENV:-prd}
    driver: bridge
